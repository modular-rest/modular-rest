name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  # npm trusted publishing: npm trades this job's OIDC token for a short-lived publish
  # credential, so no npm token is stored. Each package names this repository and
  # release.yml as its trusted publisher on npmjs.com.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false

      # @semantic-release/npm 13 (trusted publishing) needs Node 22.14 or later. No
      # registry-url here: it writes an .npmrc token line that overrides trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn workspaces run build

      # Release client package
      - name: Release client package
        working-directory: packages/client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          npx semantic-release --debug

      # Release server package
      - name: Release server package
        working-directory: packages/server-ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          npx semantic-release --debug
